<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Light Luxury Theme Gradients -->
    <linearGradient id="ojasLightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A58CA" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>

    <linearGradient id="ojasWarmPeachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F2" />
      <stop offset="100%" stop-color="#FFDBBB" />
    </linearGradient>

    <linearGradient id="ojasCoreGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Light Porcelain/Linen Background Base -->
  <circle cx="50" cy="50" r="47" fill="url(#ojasWarmPeachGrad)" />
  <circle cx="50" cy="50" r="47" stroke="#0A58CA" stroke-width="2.2" opacity="0.85" />

  <!-- Outer Kinetic Neural Orbit Ring -->
  <circle cx="50" cy="50" r="38" stroke="url(#ojasLightBlueGrad)" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.9" />

  <!-- Radiating Energy Lattice (Neural Core) -->
  <g stroke="#0A58CA" stroke-width="1.6" opacity="0.65">
    <line x1="50" y1="18" x2="50" y2="82" />
    <line x1="18" y1="50" x2="82" y2="50" />
    <line x1="27" y1="27" x2="73" y2="73" />
    <line x1="27" y1="73" x2="73" y2="27" />
  </g>

  <!-- Orbital Cognitive Nodes (Royal Blue & Amber) -->
  <circle cx="50" cy="18" r="3.2" fill="#0A58CA" filter="url(#softGlow)" />
  <circle cx="50" cy="82" r="3.2" fill="#0A58CA" filter="url(#softGlow)" />
  <circle cx="18" cy="50" r="3.2" fill="#0A58CA" filter="url(#softGlow)" />
  <circle cx="82" cy="50" r="3.2" fill="#0A58CA" filter="url(#softGlow)" />

  <circle cx="28" cy="28" r="2.8" fill="#FFAA00" />
  <circle cx="72" cy="72" r="2.8" fill="#FFAA00" />
  <circle cx="28" cy="72" r="2.8" fill="#FFAA00" />
  <circle cx="72" cy="28" r="2.8" fill="#FFAA00" />

  <!-- Inner Spark Circle (Inner O) -->
  <circle cx="50" cy="50" r="20" stroke="#0A58CA" stroke-width="1.8" fill="#FFFFFF" opacity="0.95" />

  <!-- Center Luminous Intelligence Core -->
  <circle cx="50" cy="50" r="10.5" fill="url(#ojasCoreGold)" filter="url(#softGlow)" />
  <circle cx="50" cy="50" r="4.8" fill="#FFFFFF" />
</svg>
